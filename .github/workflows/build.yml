name: Release & Multi-Platform Build Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-sidecar-and-app:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_binary: litellm-proxy-x86_64-pc-windows-msvc.exe
            py_sidecar_out: sidecar/dist/litellm-proxy/litellm-proxy.exe
          - name: macOS Apple Silicon (arm64)
            os: macos-latest
            target: aarch64-apple-darwin
            sidecar_binary: litellm-proxy-aarch64-apple-darwin
            py_sidecar_out: sidecar/dist/litellm-proxy/litellm-proxy
          - name: macOS Intel (x64)
            os: macos-13
            target: x86_64-apple-darwin
            sidecar_binary: litellm-proxy-x86_64-apple-darwin
            py_sidecar_out: sidecar/dist/litellm-proxy/litellm-proxy
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            sidecar_binary: litellm-proxy-x86_64-unknown-linux-gnu
            py_sidecar_out: sidecar/dist/litellm-proxy/litellm-proxy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python build dependencies & LiteLLM sidecar
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          pip install -r sidecar/requirements.txt

      - name: Run Python security tests
        run: python -m unittest discover -s tests -v

      - name: Run standalone air-gap security tests
        run: python sidecar/test_airgap_security.py

      - name: Compile PyInstaller Sidecar Binary
        shell: bash
        run: |
          cd sidecar
          pyinstaller litellm-proxy.spec --noconfirm --clean
          cd ..
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp "${{ matrix.platform.py_sidecar_out }}" src-tauri/binaries/${{ matrix.platform.sidecar_binary }}
          else
            cp "${{ matrix.platform.py_sidecar_out }}" src-tauri/binaries/${{ matrix.platform.sidecar_binary }}
            chmod +x src-tauri/binaries/${{ matrix.platform.sidecar_binary }}
          fi
          cp -R sidecar/dist/litellm-proxy/_internal src-tauri/binaries/_internal

      - name: Smoke-test packaged LiteLLM sidecar and process tree
        run: python tests/test_packaged_smoke.py --executable "${{ matrix.platform.py_sidecar_out }}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run MCP Adapter & Contract Test Suite
        run: npx tsx test/adapters.test.ts

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Check native code
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Lint native code
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test native code
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
        env:
          TETHER_PACKAGED_SIDECAR_TEST: '1'

      - name: Build Tauri Desktop Application Bundle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.platform.target }}

      - name: Build bundle and draft tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'TetherMesh v__VERSION__'
          releaseBody: 'See changelog for release notes.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.platform.target }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tethermesh-${{ matrix.platform.target }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
