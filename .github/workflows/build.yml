name: Release & Multi-Platform Build Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-sidecar-and-app:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_binary: litellm-proxy-x86_64-pc-windows-msvc.exe
            py_sidecar_out: sidecar/dist/litellm-proxy.exe
          - name: macOS Apple Silicon (arm64)
            os: macos-latest
            target: aarch64-apple-darwin
            sidecar_binary: litellm-proxy-aarch64-apple-darwin
            py_sidecar_out: sidecar/dist/litellm-proxy
          - name: macOS Intel (x64)
            os: macos-13
            target: x86_64-apple-darwin
            sidecar_binary: litellm-proxy-x86_64-apple-darwin
            py_sidecar_out: sidecar/dist/litellm-proxy
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            sidecar_binary: litellm-proxy-x86_64-unknown-linux-gnu
            py_sidecar_out: sidecar/dist/litellm-proxy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python build dependencies & LiteLLM sidecar
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          pip install -r sidecar/requirements.txt

      - name: Compile PyInstaller Sidecar Binary
        shell: bash
        run: |
          cd sidecar
          pyinstaller litellm-proxy.spec --noconfirm --clean
          cd ..
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp sidecar/dist/litellm-proxy.exe src-tauri/binaries/${{ matrix.platform.sidecar_binary }}
            cp sidecar/dist/litellm-proxy.exe src-tauri/binaries/litellm-proxy.exe
          else
            cp sidecar/dist/litellm-proxy src-tauri/binaries/${{ matrix.platform.sidecar_binary }}
            cp sidecar/dist/litellm-proxy src-tauri/binaries/litellm-proxy
            chmod +x src-tauri/binaries/${{ matrix.platform.sidecar_binary }}
            chmod +x src-tauri/binaries/litellm-proxy
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run MCP Adapter & Contract Test Suite
        run: npx tsx test/adapters.test.ts

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri Desktop Application Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'TetherMesh v__VERSION__'
          releaseBody: 'See changelog for release notes.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.platform.target }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tethermesh-${{ matrix.platform.target }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
