[package]
name = "tethermesh"
version = "1.0.0"
description = "TetherMesh - Zero-config local desktop control plane and proxy gateway for autonomous AI coding agents"
authors = ["TetherMesh Team"]
edition = "2021"

[lib]
name = "tethermesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.8"
tokio = { version = "1.38", features = ["full"] }
