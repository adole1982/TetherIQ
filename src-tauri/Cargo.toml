[package]
name = "tethermesh"
version = "1.0.0"
description = "TetherMesh - Zero-config local desktop control plane and proxy gateway for autonomous AI coding agents"
authors = ["TetherMesh Team"]
edition = "2021"

[lib]
name = "tethermesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.8"
tokio = { version = "1.38", features = ["full"] }
toml_edit = "0.22"
sha2 = "0.10"
keyring = "2.1"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde_yaml = "0.9"
hmac-sha256 = "1.1"
futures-util = "0.3"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
