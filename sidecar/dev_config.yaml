# TetherMesh Dev Config — LiteLLM Proxy
# Usage: litellm --port 4000 --host 127.0.0.1 --config sidecar/dev_config.yaml
#
# Set provider API keys as environment variables before running:
#   ANTHROPIC_API_KEY, OPENAI_API_KEY, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#   GROQ_API_KEY

model_list:
  # --- heavy-reasoning virtual alias ---
  - model_name: heavy-reasoning
    litellm_params:
      model: anthropic/claude-3-7-sonnet-20250219
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 60

  - model_name: heavy-reasoning
    litellm_params:
      model: bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: us-east-1
      timeout: 60

  - model_name: heavy-reasoning
    litellm_params:
      model: openai/o3-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 45

  # --- fast-code virtual alias ---
  - model_name: fast-code
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      timeout: 10

  - model_name: fast-code
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 15

  - model_name: fast-code
    litellm_params:
      model: ollama/qwen2.5-coder:14b
      api_base: http://localhost:11434
      timeout: 30

  # --- Cursor Auto compatibility aliases ---
  - model_name: auto
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 60

  - model_name: auto
    litellm_params:
      model: bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: us-east-1
      timeout: 60

  - model_name: auto
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      timeout: 60

  - model_name: cursor-auto
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 60

  # --- Standalone model bindings ---
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # --- Standalone model bindings (Bedrock + Anthropic Fallback) ---
  - model_name: claude-3-7-sonnet-20250219
    litellm_params:
      model: bedrock/anthropic.claude-3-7-sonnet-20250219-v1:0
      aws_region_name: us-east-1
      timeout: 60

  - model_name: claude-3-7-sonnet-20250219
    litellm_params:
      model: anthropic/claude-3-7-sonnet-20250219
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 60

  - model_name: claude-3-7-sonnet-latest
    litellm_params:
      model: bedrock/anthropic.claude-3-7-sonnet-20250219-v1:0
      aws_region_name: us-east-1
      timeout: 60

  - model_name: claude-3-5-sonnet-20241022
    litellm_params:
      model: bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0
      aws_region_name: us-east-1
      timeout: 60

  - model_name: claude-3-5-sonnet-20241022
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 60

  - model_name: claude-3-5-sonnet-latest
    litellm_params:
      model: bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0
      aws_region_name: us-east-1
      timeout: 60

  - model_name: claude-3-5-haiku-20241022
    litellm_params:
      model: bedrock/anthropic.claude-3-5-haiku-20241022-v1:0
      aws_region_name: us-east-1
      timeout: 30

  - model_name: claude-3-5-haiku-20241022
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 30

  - model_name: claude-3-5-haiku-latest
    litellm_params:
      model: bedrock/anthropic.claude-3-5-haiku-20241022-v1:0
      aws_region_name: us-east-1
      timeout: 30

router_settings:
  routing_strategy: "least-busy"
  num_retries: 2
  retry_after: 1
  cooldown_time: 30
  allowed_fails: 2
  fallbacks:
    - heavy-reasoning: ["gpt-4o", "fast-code"]
    - fast-code: ["gpt-4o-mini"]

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 60
  max_budget: 10.0
  budget_duration: "1d"

general_settings:
  disable_admin_ui: true
